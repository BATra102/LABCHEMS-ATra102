<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="flask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Laboratory Flask Structure -->
  <g transform="translate(64, 48)">
    <!-- Flask Neck & Body Outer -->
    <path d="M152 40 L232 40 L232 140 L334 320 C348 344 330 376 302 376 L82 376 C54 376 36 344 50 320 L152 140 Z" fill="none" stroke="url(#flask)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Flask Rim -->
    <rect x="136" y="24" width="112" height="24" rx="12" fill="url(#flask)"/>
    
    <!-- Liquid Inside Flask -->
    <path d="M90 280 Q192 250 294 280 L314 316 C326 338 310 364 286 364 L98 364 C74 364 58 338 70 316 Z" fill="url(#liquid)" opacity="0.9"/>
    
    <!-- Chemical Bubbles -->
    <circle cx="150" cy="300" r="14" fill="#ffffff" opacity="0.6"/>
    <circle cx="230" cy="320" r="18" fill="#ffffff" opacity="0.5"/>
    <circle cx="190" cy="270" r="10" fill="#ffffff" opacity="0.7"/>
    <circle cx="192" cy="190" r="8" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>
